<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="max-w-2xl mx-auto">
      <h1 class="text-3xl font-bold underline">
        Hello, I'm using a backend framework!
      </h1>
      <form method="get" action="{% url 'post_search' %}" class="mb-4">
        <input
          type="text"
          name="q"  
          placeholder="Search posts..."
          class="border p-2 rounded"
        />
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">
          Search
        </button>
      </form>
      {% for post in posts %}
      <div class="bg-white shadow rounded-xl p-4 mb-4">
        <a href="{% url 'post_detail' post.id %}" class="text-lg mb-2 block"
          >{{ post.title }}</a
        >
        <span class="text-sm text-gray-500">{{ post.created_date }}</span>
      </div>
      {% endfor %}
    </div>
  </body>
</html>
